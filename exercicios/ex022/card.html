<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo Layout CARD</title>
    <style>
        * {
                margin:0;
                padding:0;
                box-sizing:border-box;
                transition:0.3s;
            }

        body {
                font-family:Arial, Helvetica, sans-serif;
                padding:40px;
                background-color: gray;
            }

        .cards {
                display:grid;
                grid-template-columns:repeat(3,1fr);
                gap:20px;
                border-radius: 20px;
            }

        .card {
                background:white;
                padding:20px;
                border-radius:8px;
                box-shadow:0 5px 15px rgba(0,0,0,0.2);
            }
            .card img {
                border-radius: 15px;
                width: 200px;
            }
    </style>
</head>
<body>
    <h1>Artigos</h1>

    <section class="cards">

        <div class="card">
            <img src="imagens/pattern001.png">
            <h2>Artigo 1</h2>
            <p>Pequena descrição do artigo.</p>
            <a href="#">Ler análise</a>
        </div>

        <div class="card">
            <img src="imagens/pattern002.png">
            <h2>Artigo 2</h2>
            <p>Pequena descrição do artigo.</p>
            <a href="#">Ler análise</a>
        </div>

        <div class="card">
            <img src="imagens/pattern003.png">
            <h2>Artigo 3</h2>
            <p>Pequena descrição do artigo.</p>
            <a href="#">Ler análise</a>
        </div>

    </section>
    
</body>
</html>
